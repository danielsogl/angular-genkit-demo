min_version: 2.0.0

pre-commit:
  parallel: false
  jobs:
    - name: eslint
      glob:
        - '*.ts'
        - '*.html'
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    - name: prettier
      glob:
        - '*.ts'
        - '*.html'
        - '*.scss'
        - '*.css'
        - '*.json'
        - '*.md'
        - '*.yml'
        - '*.yaml'
        - '*.js'
        - '*.mjs'
        - '*.cjs'
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
